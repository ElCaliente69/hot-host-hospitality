<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>Solicitud segura · Hot Host Hospitality</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 18px; background: radial-gradient(circle at top, #fff8e7, #eee4d2 70%); color: #241d14; font-family: Arial, sans-serif; }
    main { width: min(560px, 100%); overflow: hidden; border: 1px solid #dfd0b6; border-radius: 24px; background: #fffdf9; box-shadow: 0 24px 70px rgba(62, 43, 17, .16); }
    .brand { padding: 25px 34px; background: #131313; color: #fff; }
    .brand strong { display: block; font-size: 22px; letter-spacing: .14em; }
    .brand span { display: block; margin-top: 4px; color: #e1aa3f; font-size: 11px; font-weight: 800; letter-spacing: .24em; }
    .content { padding: 34px; }
    .label { display: inline-block; padding: 8px 13px; border-radius: 999px; background: #e6f5eb; color: #126c3e; font-size: 13px; font-weight: 800; }
    h1 { margin: 18px 0 12px; font: 700 clamp(30px, 7vw, 46px)/1.05 Georgia, serif; }
    p { margin: 0; color: #685c49; font-size: 16px; line-height: 1.65; }
    a { display: inline-block; margin-top: 24px; padding: 13px 20px; border-radius: 999px; background: #198754; color: #fff; font-weight: 800; text-decoration: none; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><strong>HOT HOST</strong><span>HOSPITALITY</span></div>
    <div class="content">
      <span class="label">Enlace privado</span>
      <h1 id="title">Abriendo tu solicitud</h1>
      <p id="message">Estamos conectando de forma segura con el estado de tu solicitud.</p>
      <a id="continue" href="#" rel="noreferrer" hidden>Continuar</a>
    </div>
  </main>
  <script src="assets/config.js?v=20260727-4"></script>
  <script>
    (function () {
      "use strict";
      var title = document.getElementById("title");
      var message = document.getElementById("message");
      var continueLink = document.getElementById("continue");
      var parameters = new URLSearchParams(window.location.hash.slice(1));
      var type = parameters.has("request") ? "request" : parameters.has("admin") ? "admin" : "";
      var token = type ? String(parameters.get(type) || "").trim() : "";
      var config = window.HOT_HOST_CONFIG || {};
      var endpoint = String(config.googleAppsScriptEndpoint || "").trim();

      if (!type || !/^[a-f0-9]{64}$/i.test(token) || !/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(endpoint)) {
        title.textContent = "Enlace no válido";
        message.textContent = "Abre el enlace incluido en el último correo de Hot Host Hospitality o escribe a direccion@hhosthospitality.com.";
        return;
      }

      var target = new URL(endpoint);
      target.searchParams.set(type, token);
      continueLink.href = target.toString();
      continueLink.hidden = false;
      window.location.replace(target.toString());
    })();
  </script>
</body>
</html>
